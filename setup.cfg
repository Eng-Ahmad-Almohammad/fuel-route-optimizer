
[flake8]
# flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
show-source = true
doctests = true
enable-extensions = G


# Flake plugins:
max-line-length = 120
max-doc-length = 120
indent-size = 4
statistics = True
max-complexity = 6
max-imports = 20
docstring-convention=google
inline-quotes = double

# Excluding some directories:
exclude = .git,__pycache__,.venv, venv,.env, manage.py, **/migrations, **/__init__.*
ignore =
per-file-ignores =
rst-roles =class,func,ref
rst-directives =envvar,exception
rst-substitutions = version
extend-ignore = RST307,RST201,RST203,RST301,

[isort]
# isort configuration:
# https://github.com/PyCQA/isort/wiki/isort-Settings
include_trailing_comma = true
use_parentheses = true
# See https://github.com/PyCQA/isort#multi-line-output-modes
multi_line_output = 3
line_length = 120
atomic = true
profile = django
skip_gitignore = true


[mypy]
# Mypy configuration:
# https://mypy.readthedocs.io/en/latest/config_file.html
enable_error_code = truthy-bool, redundant-expr, unused-awaitable
python_version = 3.12

# General strictness and safety settings
check_untyped_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_any_generics = True
strict_optional = True
strict_equality = True
no_implicit_optional = True
local_partial_types = True

# Reporting and warning settings
warn_unused_ignores = True
warn_redundant_casts = True
warn_no_return = True
warn_unreachable = True
warn_unused_configs = True

# Ignore issues in third-party libraries by default
ignore_missing_imports = True

# Prevent the redefinition of variables
allow_redefinition = False

# Ensure symbols are re-exported explicitly
implicit_reexport = False

# Plugins to enhance Django compatibility
plugins = mypy_django_plugin.main

[mypy.plugins.django-stubs]
# Set your Django settings module
django_settings_module = "core.settings"

[mypy-*.migrations.*]
# Ignore errors in migrations as they are generated code
ignore_errors = True

[mypy-manage.*]
# Ignore errors in migrations as they are generated code
ignore_errors = True

[tool:pytest]
# pytest configuration:
# https://docs.pytest.org/en/stable/reference/customize.html
DJANGO_SETTINGS_MODULE = core.test_settings
python_files = tests.py test_*.py *_tests.py
norecursedirs = .git __pycache__ .venv .mypy_cache htmlcov
# Fail xfail-marked tests that unexpectedly pass
xfail_strict = true
# --cov-fail-under: fail the run if total coverage drops below 90%
addopts =
    --strict-markers
    --strict-config
    --doctest-modules
    --tb=short
    -n auto
    --cov=.
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=90

[coverage:run]
# Coverage configuration:
# https://coverage.readthedocs.io/en/latest/config.html
branch = True
omit =
    .venv/*
    */tests/*
    */test_*.py
    */migrations/*
    manage.py
    core/settings/*
    core/test_settings.py
    core/asgi.py
    core/wsgi.py
    core/urls.py
